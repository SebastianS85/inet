
<svg
    version="1.1"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 200 200"
    width="200"
    height="200"
>
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="90" fill="#1E1E1E" stroke="#00FF00" stroke-width="5" />
    
    <!-- Lightning Bolt -->
    <polygon 
        points="90,30 110,30 100,90 130,90 80,160 100,100 70,100" 
        fill="#00FF00" 
    />
    
    <!-- Radio Waves -->
    <path 
        d="M 150 100 Q 165 75, 180 100 Q 165 125, 150 100" 
        stroke="#00FF00" stroke-width="4" fill="none"
    />
    <path 
        d="M 40 100 Q 25 75, 10 100 Q 25 125, 40 100" 
        stroke="#00FF00" stroke-width="4" fill="none"
    />
    
    <!-- Text -->
    <text x="50" y="180" font-family="Arial" font-size="20" fill="#00FF00" font-weight="bold">
        STORMRADIO
    </text>
</svg>
